<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Card</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="navbar">
        <nav>
            <a href="#home">Home</a>
            <a href="#leetcode">leetcode</a>
            <a href="#github">github</a>
            <a href="#codechef">codechef</a>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <div class="avatar-container">
                <img id="user-avatar" src="john.png" alt="User Avatar">
            </div>
            <div class="user-info">
                <h2 id="user-name">John Doe</h2>
                <p id="user-gender">Male</p>
            </div>
            <div class="button-group">
                <button id="toggle-btn" class="btn" onclick="toggle()">Toggle User</button>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
